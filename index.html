
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#eef5ff;font:16px Arial,sans-serif}
header{padding:18px;background:#10233b;border-bottom:1px solid #294766}
h1{margin:0;font-size:24px}
main{max-width:1000px;margin:auto;padding:16px;display:grid;gap:16px}
.panel{background:#102038;border:1px solid #294766;border-radius:12px;padding:16px}
button,.file-button{display:inline-block;background:#1769ed;color:white;border:0;border-radius:8px;padding:12px;margin:4px;cursor:pointer;font-weight:bold}
button:hover,.file-button:hover{background:#3585ff}
input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#071525;color:white;border:1px solid #365574;border-radius:7px}
textarea{min-height:100px}
video{width:100%;max-height:420px;background:#000;margin-top:12px}
#status{color:#70e4b8}
#result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
#previewText{font-size:28px;font-weight:bold;text-align:center;white-space:pre-wrap}
label{display:block;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>✦ AI Video Studio</h1>
<p id="status">JavaScript wird gestartet...</p>
</header>

<main>
<section class="panel">
<h2>🎬 Video bearbeiten</h2>

<input id="videoFile" type="file" accept="video/*">

<video id="video" controls playsinline></video>

<button id="play">▶ Abspielen / Pause</button>
<button id="download">Video herunterladen</button>

<label>Helligkeit</label>
<input id="brightness" type="range" min="50" max="150" value="100">

<label>Kontrast</label>
<input id="contrast" type="range" min="50" max="150" value="100">

<label>Sättigung</label>
<input id="saturation" type="range" min="0" max="200" value="100">

<label>Titeltext</label>
<textarea id="title">Mein AI Video</textarea>

<label>Textfarbe</label>
<input id="color" type="color" value="#ffffff">

<button id="applyText">Text anzeigen</button>
<div id="previewText"></div>
</section>

<section class="panel">
<h2>🤖 Gemini KI-Assistent</h2>

<p>
Füge deinen neuen Gemini API-Key ein.
Der Schlüssel wird nicht in dieser HTML-Datei gespeichert.
</p>

<label>Gemini API-Key</label>
<input id="apiKey" type="password"
placeholder="Gemini API-Key">

<label>Was soll die KI machen?</label>
<textarea id="prompt"
placeholder="Erstelle einen Videotitel und Schnittideen..."></textarea>

<button id="ask">Gemini fragen</button>
<div id="result">Bereit.</div>
</section>
</main>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);

const video = $("video");
let videoURL = null;
let videoName = "video";

function status(message){
  $("status").textContent = message;
}

status("JavaScript funktioniert!");

$("videoFile").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  if(videoURL) URL.revokeObjectURL(videoURL);

  videoURL = URL.createObjectURL(file);
  videoName = file.name;
  video.src = videoURL;
  video.load();

  status("Video geladen: " + file.name);
});

$("play").addEventListener("click", async function(){
  if(!video.src){
    status("Bitte zuerst ein Video auswählen.");
    return;
  }

  try{
    if(video.paused){
      await video.play();
    }else{
      video.pause();
    }
  }catch(error){
    status("Wiedergabefehler: " + error.message);
  }
});

$("download").addEventListener("click", function(){
  if(!videoURL){
    status("Bitte zuerst ein Video auswählen.");
    return;
  }

  const link = document.createElement("a");
  link.href = videoURL;
  link.download = videoName;
  document.body.appendChild(link);
  link.click();
  link.remove();
});

function updateFilters(){
  video.style.filter =
    "brightness(" + $("brightness").value + "%) " +
    "contrast(" + $("contrast").value + "%) " +
    "saturate(" + $("saturation").value + "%)";
}

["brightness","contrast","saturation"].forEach(id => {
  $(id).addEventListener("input", updateFilters);
});

$("applyText").addEventListener("click", function(){
  $("previewText").textContent = $("title").value;
  $("previewText").style.color = $("color").value;
  status("Text aktualisiert.");
});

$("ask").addEventListener("click", async function(){
  const key = $("apiKey").value.trim();
  const prompt = $("prompt").value.trim();

  if(!key){
    $("result").textContent = "Bitte API-Key eingeben.";
    return;
  }

  if(!prompt){
    $("result").textContent = "Bitte einen Auftrag eingeben.";
    return;
  }

  const button = $("ask");
  button.disabled = true;
  $("result").textContent = "Gemini wird angefragt...";

  try{
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": key
        },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text:
                "Du bist ein Videoeditor-Assistent. " +
                "Erstelle konkrete Schnittideen, Titel, " +
                "Untertitel und Übergangsvorschläge auf Deutsch. " +
                "Du kannst das Video nicht selbst rendern. Auftrag: " +
                prompt
            }]
          }]
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error?.message || "HTTP " + response.status
      );
    }

    const answer =
      data.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        .join("\n");

    $("result").textContent =
      answer || "Keine Antwort erhalten.";

    status("Gemini-Antwort erhalten.");

  }catch(error){
    $("result").textContent =
      "Fehler: " + error.message +
      "\nPrüfe API-Key, Modellzugriff und Internetverbindung.";

    status("Gemini-Anfrage fehlgeschlagen.");

  }finally{
    button.disabled = false;
  }
});

})();
</script>
</body>
</html>
