<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine lokale Bild-KI</title>
  <style>
    body {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 16px;
      font: 17px system-ui, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    h1 { font-size: 1.6rem; }
    section {
      margin: 16px 0;
      padding: 16px;
      border-radius: 12px;
      background: white;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font: inherit;
    }
    button { border: 0; border-radius: 8px; background: #1769aa; color: white; }
    #preview { max-width: 100%; max-height: 300px; margin-top: 12px; }
    #result { white-space: pre-wrap; }
    .small { color: #536273; font-size: 0.92rem; }
  </style>
</head>
<body>
  <h1>Meine lokale Bild-KI</h1>
  <p class="small">Funktioniert auf diesem Gerät. Keine API, kein Upload.</p>

  <section>
    <h2>Beispiel hinzufügen</h2>
    <input id="file" type="file" accept="image/*">
    <img id="preview" alt="Bildvorschau" hidden>
    <input id="caption" type="text" placeholder="Was ist auf dem Bild?">
    <button id="learn">Beispiel lernen</button>
  </section>

  <section>
    <h2>Bild erkennen</h2>
    <button id="predict">Bild erkennen</button>
    <p id="result">Lerne zuerst ein paar Beispiele.</p>
  </section>

  <section>
    <button id="clear">Alle gelernten Beispiele löschen</button>
    <p id="count" class="small"></p>
  </section>

  <canvas id="canvas" width="32" height="32" hidden></canvas>

<script>
  // Jede Bildbeschreibung wird mit einfachen Farbmerkmalen verknüpft.
  // Die Merkmale bestehen aus 4 x 4 Bildbereichen mit je RGB-Mittelwerten.
  const STORAGE_KEY = "meine-lokale-bild-ki-v1";
  const fileInput = document.getElementById("file");
  const captionInput = document.getElementById("caption");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  const count = document.getElementById("count");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  let currentImage = null;
  let examples = loadExamples();

  function loadExamples() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function saveExamples() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(examples));
    } catch {
      result.textContent =
        "Der Browser konnte die Beispiele nicht speichern. Probiere es in einem normalen Safari-Tab.";
    }
    count.textContent = `Gelernte Beispiele: ${examples.length}`;
  }

  function getFeatures(image) {
    ctx.clearRect(0, 0, 32, 32);
    ctx.drawImage(image, 0, 0, 32, 32);
    const pixels = ctx.getImageData(0, 0, 32, 32).data;
    const features = [];

    for (let cellY = 0; cellY < 4; cellY++) {
      for (let cellX = 0; cellX < 4; cellX++) {
        let r = 0, g = 0, b = 0, n = 0;

        for (let y = cellY * 8; y < cellY * 8 + 8; y++) {
          for (let x = cellX * 8; x < cellX * 8 + 8; x++) {
            const i = (y * 32 + x) * 4;
            r += pixels[i];
            g += pixels[i + 1];
            b += pixels[i + 2];
            n++;
          }
        }

        features.push(r / n / 255, g / n / 255, b / n / 255);
      }
    }
    return features;
  }

  function cosineSimilarity(a, b) {
    let dot = 0, aa = 0, bb = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      aa += a[i] * a[i];
      bb += b[i] * b[i];
    }
    return dot / (Math.sqrt(aa * bb) + 1e-8);
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;

    const image = new Image();
    image.onload = () => {
      currentImage = image;
      preview.src = image.src;
      preview.hidden = false;
      URL.revokeObjectURL(image.src);
      result.textContent = "Bild geladen. Du kannst es erkennen lassen oder als Beispiel speichern.";
    };
    image.onerror = () => {
      result.textContent = "Das Bild konnte nicht geöffnet werden.";
    };
    image.src = URL.createObjectURL(file);
  });

  document.getElementById("learn").addEventListener("click", () => {
    const caption = captionInput.value.trim();
    if (!currentImage) {
      result.textContent = "Wähle zuerst ein Bild aus.";
      return;
    }
    if (!caption) {
      result.textContent = "Schreibe zuerst eine kurze Bildbeschreibung.";
      return;
    }

    examples.push({ caption, features: getFeatures(currentImage) });
    saveExamples();
    result.textContent = `Gelernt: „${caption}“`;
    captionInput.value = "";
  });

  document.getElementById("predict").addEventListener("click", () => {
    if (!currentImage) {
      result.textContent = "Wähle zuerst ein Bild aus.";
      return;
    }
    if (!examples.length) {
      result.textContent = "Lerne erst Beispiele mit Bildbeschreibungen.";
      return;
    }

    const features = getFeatures(currentImage);
    const best = examples
      .map(example => ({
        caption: example.caption,
        score: cosineSimilarity(features, example.features)
      }))
      .sort((a, b) => b.score - a.score)[0];

    result.textContent =
      `Meine Vermutung: „${best.caption}“\n` +
      `Ähnlichkeit zum besten Beispiel: ${Math.round(best.score * 100)} %`;
  });

  document.getElementById("clear").addEventListener("click", () => {
    examples = [];
    localStorage.removeItem(STORAGE_KEY);
    saveExamples();
    result.textContent = "Alle Beispiele wurden gelöscht.";
  });

  saveExamples();
</script>
</body>
</html>
