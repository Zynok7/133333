<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meine lokale KI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #17202a;
      background: #eef1f5;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: #173c61;
      color: white;
      z-index: 2;
    }

    header h1 { margin: 0; font-size: 19px; }
    header p { margin: 3px 0 0; font-size: 12px; opacity: .85; }

    #chat {
      height: 100dvh;
      overflow-y: auto;
      padding: 82px 12px 105px;
    }

    .message {
      width: fit-content;
      max-width: 88%;
      margin: 10px 0;
      padding: 11px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .user {
      margin-left: auto;
      background: #1769aa;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot {
      margin-right: auto;
      background: white;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 3px #0001;
    }

    #bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid #d5dbe1;
    }

    #text {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #c5ccd4;
      border-radius: 22px;
      font: inherit;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 22px;
      padding: 0 18px;
      background: #1769aa;
      color: white;
      font: inherit;
    }

    #clear {
      position: fixed;
      right: 12px;
      top: 52px;
      z-index: 3;
      padding: 6px 10px;
      border-radius: 8px;
      background: #ffffff22;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Meine lokale KI</h1>
    <p>Chat und Gedächtnis bleiben in diesem Browser gespeichert.</p>
  </header>

  <button id="clear">Chat löschen</button>
  <main id="chat" aria-live="polite"></main>

  <form id="bar">
    <input id="text" autocomplete="off"
           placeholder="Schreib eine Nachricht…" aria-label="Nachricht">
    <button type="submit">Senden</button>
  </form>

<script>
  const KEY = "ipad-lokale-ki-chat-v1";
  const chat = document.getElementById("chat");
  const form = document.getElementById("bar");
  const input = document.getElementById("text");

  let messages = [];
  try {
    messages = JSON.parse(localStorage.getItem(KEY) || "[]");
  } catch {
    messages = [];
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(messages));
    } catch {
      addMessage("System", "Der Browser-Speicher ist voll. Lösche alte Chats.");
    }
  }

  function addMessage(role, text) {
    messages.push({ role, text, time: Date.now() });
    save();
    showMessage(role, text);
  }

  function showMessage(role, text) {
    const bubble = document.createElement("div");
    bubble.className = "message " + (role === "Du" ? "user" : "bot");
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  }

  // Einfache lokale Erinnerung: sucht nach früheren Nachrichten
  // mit gemeinsamen bedeutungsvollen Wörtern.
  function findMemory(query) {
    const words = query.toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu, " ")
      .split(/\s+/)
      .filter(w => w.length > 3);

    if (!words.length) return null;

    const candidates = messages.filter(m =>
      m.role === "Du" &&
      m.text.toLowerCase() !== query.toLowerCase()
    );

    let best = null;
    let bestScore = 0;

    for (const m of candidates) {
      const old = m.text.toLowerCase();
      const score = words.reduce((n, word) => n + (old.includes(word) ? 1 : 0), 0);
      if (score > bestScore) {
        best = m.text;
        bestScore = score;
      }
    }

    return bestScore > 0 ? best : null;
  }

  function think(text) {
    const t = text.toLowerCase().trim();

    if (/^(hi|hallo|hey|guten morgen|guten tag)\b/.test(t)) {
      return "Hallo! Schreib mir etwas. Ich speichere unseren Chat in diesem Browser.";
    }

    if (t.includes("wie heißt du")) {
      return "Ich bin deine lokale KI. Du kannst den Namen im HTML-Code ändern.";
    }

    if (t.includes("was weißt du über mich") || t.includes("was erinnerst du")) {
      const past = messages
        .filter(m => m.role === "Du")
        .slice(-5)
        .map(m => "• " + m.text);

      return past.length
        ? "Diese letzten Nachrichten von dir kann ich im Chatverlauf sehen:\n" + past.join("\n")
        : "Ich habe noch keine Nachrichten von dir gespeichert.";
    }

    const memory = findMemory(t);
    if (memory) {
      return "Das erinnert mich an eine frühere Nachricht von dir:\n„" +
        memory + "“\n\nIch kann einfache Ähnlichkeiten im gespeicherten Chat finden, aber noch nicht frei darüber nachdenken.";
    }

    if (t.endsWith("?")) {
      return "Ich habe deine Frage gespeichert, kann sie aber ohne ein eingebautes Sprachmodell nicht zuverlässig beantworten. Ich kann mich an Nachrichten erinnern, die du hier schreibst.";
    }

    return "Ich habe das gespeichert. Meine jetzige Denkfunktion ist noch einfach: Sie kann den Chat behalten und ähnliche frühere Nachrichten suchen.";
  }

  function renderSaved() {
    chat.innerHTML = "";
    if (!messages.length) {
      showMessage("KI", "Hallo! Ich bin deine lokale Chat-KI. Schreib mir unten eine Nachricht.");
      return;
    }
    for (const m of messages) showMessage(m.role, m.text);
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addMessage("Du", text);

    const answer = think(text);
    addMessage("KI", answer);
  });

  document.getElementById("clear").addEventListener("click", () => {
    if (!confirm("Den gespeicherten Chat wirklich löschen?")) return;
    messages = [];
    localStorage.removeItem(KEY);
    renderSaved();
  });

  renderSaved();
</script>
</body>
</html>
